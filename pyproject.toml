[project]
name = "relayguard"
version = "0.3.0"
description = "A governed LLM gateway with intelligent routing and fallbacks."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "openai>=1.68,<2.0", "psycopg[binary]>=3.2,<4.0", "pydantic-settings>=2.6,<3.0", "redis>=5.2,<6.0", "uvicorn[standard]>=0.32,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
